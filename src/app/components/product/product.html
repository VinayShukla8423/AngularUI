<h2>Product List</h2>

<ul>
  <li *ngFor="let p of products">
    
    <!-- VIEW MODE -->
    <span *ngIf="editId !== p.id">
      {{p.name}} - ₹{{p.price}}
      
      <button (click)="edit(p)">Edit</button>
      <button (click)="delete(p.id)">Delete</button>
    </span>

    <!-- EDIT MODE -->
    <span *ngIf="editId === p.id">
      <input [(ngModel)]="editProduct.name">
      <input [(ngModel)]="editProduct.price" type="number">

      <button (click)="update()">Save</button>
      <button (click)="cancel()">Cancel</button>
    </span>

  </li>
</ul>

<h3>Add Product</h3>

<form (ngSubmit)="add()" #form="ngForm">
  <input [(ngModel)]="newProduct.name" name="name" placeholder="Name" required>
  <input [(ngModel)]="newProduct.price" name="price" type="number" placeholder="Price" required>

  <button type="submit" [disabled]="form.invalid">Add</button>
</form>
